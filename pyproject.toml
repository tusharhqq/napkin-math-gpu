[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-napkin-math"
version = "0.1.0"
description = "Memorable GPU numbers and a rough-estimate calculator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
benchmark = ["modal==1.5.3"]
test = ["pytest>=8.0,<9"]

[project.scripts]
gpu-napkin = "gpu_napkin:main"

[tool.setuptools]
py-modules = ["gpu_napkin", "napkin_profile", "render_results"]

[tool.setuptools.data-files]
"share/gpu-napkin-math" = ["results/h100-sxm.json", "results/a100-80gb-sxm4.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "I", "B023", "UP017", "ISC", "RUF059"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[dependency-groups]
dev = [
    "ty>=0.0.66",
]
